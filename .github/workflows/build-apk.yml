 steps:
  - name: Download project
    uses: actions/checkout@v4

  - name: Install Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK
    uses: android-actions/setup-android@v3

  - name: Create Android project
    run: |
      mkdir -p app/src/main/assets
      mkdir -p app/src/main/java/com/sasha/sportdiary
      cp index.html app/src/main/assets/
      cp icon.svg manifest.webmanifest sw.js app/src/main/assets/

      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }
      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }
      rootProject.name = 'SashaSportDiary'
      include ':app'
      EOF

      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.5.2' apply false
      }
      EOF

      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }
      android {
          namespace 'com.sasha.sportdiary'
          compileSdk 35
          defaultConfig {
              applicationId 'com.sasha.sportdiary'
              minSdk 24
              targetSdk 28
              versionCode 1
              versionName '1.0'
          }
      }
      EOF

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:label="SASHA Sport Diary"
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity>
          </application>
      </manifest>
      EOF

      cat > app/src/main/java/com/sasha/sportdiary/MainActivity.java <<'EOF'
      package com.sasha.sportdiary;

      import android.app.Activity;
      import android.os.Bundle;
      import android.webkit.WebView;
      import android.webkit.WebViewClient;
      import android.webkit.WebSettings;

      public class MainActivity extends Activity {
          @Override
          public void onCreate(Bundle state) {
              super.onCreate(state);
              WebView web = new WebView(this);
              WebSettings settings = web.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);
              web.setWebViewClient(new WebViewClient());
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
          }
      }
      EOF

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Build APK
    run: gradle assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Sasha-Sport-Diary-APK
      path: app/build/outputs/apk/debug/app-debug.apk
